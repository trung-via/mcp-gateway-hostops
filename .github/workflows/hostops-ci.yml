name: MCP Gateway HostOps Windows source policy
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/hostops/**'
      - 'tests/hostops/**'
      - '.gitattributes'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/hostops/**'
      - 'tests/hostops/**'
      - '.gitattributes'
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline provider fixtures
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/hostops/test-p2-provider-controls.ps1
          if ($LASTEXITCODE -ne 0) { throw 'OFFLINE_PROVIDER_FIXTURE_FAIL' }
      - name: Static public owner-only dispatch guards
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/hostops/test-public-hostops-workflow.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_HOSTOPS_POLICY_FAIL' }
